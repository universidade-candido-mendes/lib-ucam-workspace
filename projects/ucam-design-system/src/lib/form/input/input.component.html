<label
    *ngIf="label"
    [for]="'input-' + id"
    class="input-ucam-label {{ label_class }}">{{ label }}</label>

<input
    #input
    [id]="'input-' + id"
    [type]="'text'"
    [value]="__formattedvalue || __innervalue"
    [disabled]="__disabled"
    class="input-ucam {{ class }}"
    (keyup)="onInputChange()">

<span *ngIf="hasError('required')">
  <small>
    <strong>
      Campo obrigatório
    </strong>
  </small>
</span>

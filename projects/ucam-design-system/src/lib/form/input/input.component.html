<label
    *ngIf="label"
    [for]="'select-' + id"
    class="select-ucam-label {{ label_class }}">{{ label }}</label>

<input
    #input
    [type]="'text'"
    [value]="__innervalue"
    [disabled]="__disabled"
    (keyup)="onInputChange()">

<span *ngIf="hasError('required')">
  <small>
    <strong>
      Campo obrigatório
    </strong>
  </small>
</span>

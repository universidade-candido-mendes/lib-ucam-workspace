
<div class="sidemenu-main-menu-wrapper" [ngClass]="{'open': isMenuOpen}">
  <div class="main-menu">
    <div  class="sector header">
      <mat-icon fontIcon="menu" (click)="onToggleMenu()"></mat-icon>
    </div>

    <div  class="sector identifier">
      <img src="icon.svg" id="system-logo" alt="System logo">
      <div class="flex col">
        <p class="title">{{ routes?.app?.title }}</p>
        <p class="subtitle">{{ routes?.app?.subtitle }}</p>
      </div>
    </div>

    <div class="sector links">
      <p>MENU</p>

      <div class="links-wrapper">
        @for (link of routes?.links; track link) {
          <div>
            @if (!link?.children) {
              <div class="link"
                [routerLink]="link.address"
                routerLinkActive="active"
                ariaCurrentWhenActive="page">
                <mat-icon [fontIcon]="link.icon" title="{{link.label}}"></mat-icon>
                <div class="label">{{link.label}}</div>
              </div>
            }
            @if (link?.children) {
              <details>
                <summary class="link">
                  <mat-icon [fontIcon]="link.icon" title="{{link.label}}"></mat-icon>
                  <div class="label">{{link.label}}</div>
                </summary>
                @for (child of link?.children; track child) {
                  <div class="link"
                    [routerLink]="child.address"
                    routerLinkActive="active"
                    ariaCurrentWhenActive="page">
                    <div class="label">{{child.label}}</div>
                  </div>
                }
              </details>
            }
          </div>
        }
      </div>
    </div>

  </div>
</div>

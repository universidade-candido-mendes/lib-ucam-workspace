
<nav class="ucam-nav" aria-label="Navegação principal">
  <div class="ucam-nav__recolher-barra">
    <button class="ucam-nav__recolher" type="button" aria-label="Recolher navegação" (click)="toggleNav()">
      <svg class="ic" aria-hidden="true"><use href="#i-chevronLeft"></use></svg>
    </button>
  </div>
  <div class="ucam-nav__gaveta">
    <span class="ucam-nav__gaveta-id">
      <span class="ucam-nav__gaveta-sistema">{{ routes()?.app?.title }}</span>
    </span>
    <p class="ucam-nav__gaveta-campus">{{ routes()?.app?.subtitle }}</p>
  </div>

  <div class="ucam-nav__scroll">
    <div class="ucam-nav__group">
      @for (link of routes()?.links; track link) {
        @if (!link?.children) {
          <a class="ucam-nav__item" [routerLink]="link.address" routerLinkActive="active" ariaCurrentWhenActive="page">
            <svg class="ic ucam-nav__icone" aria-hidden="true"><use [attr.href]="'#i-' + link.icon"></use></svg>
            {{ link.label }}
          </a>
        }
        @if (link?.children) {
          <div class="ucam-nav__branch">
            <button class="ucam-nav__item ucam-nav__item--ramo" type="button" [attr.aria-expanded]="openState()[link.label] ? 'true' : 'false'" (click)="toggleBranch(link.label)">
              <svg class="ic ucam-nav__icone" aria-hidden="true"><use [attr.href]="'#i-' + link.icon"></use></svg>
              {{ link.label }}
              <svg class="ic ucam-nav__chevron" aria-hidden="true"><use href="#i-chevronDown"></use></svg>
            </button>
            <div class="ucam-nav__sub" [hidden]="!openState()[link.label]">
              @for (child of link?.children; track child) {
                <a class="ucam-nav__subitem" [routerLink]="child.address" routerLinkActive="active" ariaCurrentWhenActive="page">
                  {{ child.label }}
                </a>
              }
            </div>
          </div>
        }
      }
    </div>
  </div>
</nav>
<div class="ucam-nav-scrim" (click)="closeNav()"></div>

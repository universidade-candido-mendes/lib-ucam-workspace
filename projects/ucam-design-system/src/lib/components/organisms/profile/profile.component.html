<div class="profile-wrapper">
  <div class="profile">
    <button id="profile-button" (click)="toggleMenu()">
      <img [src]="'https://storage.googleapis.com/ucam-cdn/images/template/undefined-user.svg'" alt="Profile picture">
      <div id="profile-user-data">
        <small>{{ userprofile?.username }}</small>
        <small>{{ userprofile?.email }}</small>
      </div>
      <svg class="profile-chevron" [ngClass]="{'open': profileMenuActive}" aria-label="arrow down" data-testid="arrowDown" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M7.231 9.24a.77.77 0 0 1 1.117 0L12 13.025l3.652-3.785a.77.77 0 0 1 1.117 0 .84.84 0 0 1 0 1.157l-4.21 4.363a.77.77 0 0 1-1.117 0l-4.21-4.363a.84.84 0 0 1 0-1.157Z"></path>
      </svg>
    </button>
  </div>
</div>
<div class="profile-hidden-menu" [ngClass]="{'active': profileMenuActive}">
  <div class="change-unidade-button" [ngClass]="{'active': selectorOpen}" (click)="toggleUnidadeSelect()">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14.1668 17.5V3.33333C14.1668 2.87333 13.7935 2.5 13.3335 2.5H6.66683C6.20683 2.5 5.8335 2.87333 5.8335 3.33333V17.5" stroke="#939EAA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5.83317 7.5H2.49984C2.03984 7.5 1.6665 7.87333 1.6665 8.33333V17.5" stroke="#939EAA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.3332 17.5V8.33333C18.3332 7.87333 17.9598 7.5 17.4998 7.5H14.1665" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.9165 14.1667H12.0832" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11.2502 14.166V17.4993" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.75016 17.4993V14.166" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.3335 8.75065H11.6668" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.3335 11.2507H11.6668" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.3335 6.25065H11.6668" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4.1665 11.2507H5.83317" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4.1665 14.1667H5.83317" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.1665 11.2507H15.8332" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.1665 14.1667H15.8332" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19.1668 17.5007H0.833496" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <label>
      {{ selectedUnidade?.sigla || 'Unidade' }}
    </label>
    <svg class="toggler" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 9L12 15L18 9" stroke="#939EAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <hr class="mb-0">
  @if (selectorOpen) {
    <div class="option-wrapper">
      @for (u of unidadesOption; track u) {
        <div >
          <div class="option-label" (click)="onSetUnidade(u.value)">
            <input type="radio" class="option-radio" [checked]="selectedUnidade.oid === u.value.oid">
            <label>
              {{ u.label }}
            </label>
          </div>
          <hr class="mb-0">
        </div>
      }
    </div>
  }
  <button (click)="onExit()">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4.99805 12.5003V15.0013C4.99805 16.3826 6.1178 17.5023 7.49909 17.5023H15.0022C16.3835 17.5023 17.5033 16.3826 17.5033 15.0013V4.99714C17.5033 3.61585 16.3835 2.49609 15.0022 2.49609H7.49909C6.1178 2.49609 4.99805 3.61585 4.99805 4.99714V7.49818" stroke="#939EAA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 12.5001L12.501 9.99909L10 7.49805" stroke="#939EAA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2.49707 9.99887H12.5012" stroke="#939EAA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <label>
      Sair
    </label>
  </button>
</div>
<div class="profile-hidden-menu-backdrop"
  [ngClass]="{'active': profileMenuActive}"
  (click)="toggleMenu()">
</div>

<label
    *ngIf="label"
    [for]="'input-' + id"
    class="input-ucam-label {{ label_class }}">{{ label }}</label>

<input
    #input
    [id]="'input-' + id"
    [type]="'text'"
    [value]="__innervalue"
    [disabled]="__disabled"
    class="input-ucam {{ class }}"
    (keyup)="onInputChange()">

<div style="position: relative;">
  <span *ngIf="!optional && hasError('required')" style="position: absolute;">
    <small>
      <strong>
        Campo obrigatório
      </strong>
    </small>
  </span>
</div>

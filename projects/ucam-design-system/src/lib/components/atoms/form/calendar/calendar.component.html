<details [open]="open" >
  <summary class="ucam-calendar-input" (click)="open = !open">
    <svg class="icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.75 3.25H16.75C16.9489 3.25 17.1397 3.32902 17.2803 3.46967C17.421 3.61032 17.5 3.80109 17.5 4V16C17.5 16.1989 17.421 16.3897 17.2803 16.5303C17.1397 16.671 16.9489 16.75 16.75 16.75H3.25C3.05109 16.75 2.86032 16.671 2.71967 16.5303C2.57902 16.3897 2.5 16.1989 2.5 16V4C2.5 3.80109 2.57902 3.61032 2.71967 3.46967C2.86032 3.32902 3.05109 3.25 3.25 3.25H6.25V1.75H7.75V3.25H12.25V1.75H13.75V3.25ZM16 9.25H4V15.25H16V9.25ZM12.25 4.75H7.75V6.25H6.25V4.75H4V7.75H16V4.75H13.75V6.25H12.25V4.75ZM5.5 10.75H7V12.25H5.5V10.75ZM9.25 10.75H10.75V12.25H9.25V10.75ZM13 10.75H14.5V12.25H13V10.75Z" fill="#525866"/>
    </svg>
    <label>
      {{ selected | date: format }}
    </label>
    <svg class="help" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M10 16.25C13.4518 16.25 16.25 13.4518 16.25 10C16.25 6.54822 13.4518 3.75 10 3.75C6.54822 3.75 3.75 6.54822 3.75 10C3.75 13.4518 6.54822 16.25 10 16.25ZM11.1158 13.2086L11.2156 12.8006C11.164 12.8249 11.0807 12.8526 10.9665 12.8841C10.852 12.9157 10.7489 12.9318 10.6583 12.9318C10.4654 12.9318 10.3295 12.9001 10.2507 12.8366C10.1724 12.773 10.1333 12.6534 10.1333 12.4783C10.1333 12.4089 10.1451 12.3054 10.1697 12.17C10.1936 12.0337 10.2211 11.9126 10.2516 11.8067L10.6242 10.4876C10.6607 10.3665 10.6857 10.2334 10.6992 10.0882C10.7129 9.94325 10.7193 9.84185 10.7193 9.78429C10.7193 9.50614 10.6218 9.28041 10.4268 9.10629C10.2317 8.93229 9.95393 8.84529 9.59396 8.84529C9.39365 8.84529 9.18188 8.88088 8.95776 8.952C8.73363 9.02294 8.49933 9.1084 8.25421 9.2082L8.15415 9.6165C8.22719 9.58949 8.31419 9.56043 8.41598 9.53034C8.51732 9.50038 8.61674 9.48489 8.71347 9.48489C8.91096 9.48489 9.04399 9.51856 9.1137 9.58488C9.18342 9.65139 9.21844 9.7697 9.21844 9.93883C9.21844 10.0324 9.20736 10.1363 9.18438 10.2492C9.16172 10.3628 9.13342 10.483 9.10013 10.6098L8.72595 11.9342C8.69266 12.0734 8.66834 12.1979 8.65304 12.3084C8.63786 12.4189 8.63057 12.5272 8.63057 12.6326C8.63057 12.9048 8.73114 13.1292 8.93222 13.3063C9.13329 13.4826 9.41523 13.5714 9.77769 13.5714C10.0137 13.5714 10.2209 13.5406 10.3992 13.4785C10.5773 13.4167 10.8164 13.3268 11.1158 13.2086ZM11.0495 7.8502C11.2235 7.68882 11.3101 7.49254 11.3101 7.26272C11.3101 7.03341 11.2236 6.83675 11.0495 6.67331C10.8758 6.51032 10.6666 6.42857 10.4219 6.42857C10.1765 6.42857 9.96635 6.51013 9.79107 6.67331C9.61579 6.83675 9.52796 7.03334 9.52796 7.26272C9.52796 7.49254 9.61579 7.68875 9.79107 7.8502C9.96667 8.01217 10.1764 8.09321 10.4219 8.09321C10.6666 8.09321 10.8758 8.01217 11.0495 7.8502Z" fill="#868C98"/>
    </svg>
  </summary>
  <div class="ucam-calendar-wrapper">
    <div class="year-view view" *ngIf="view === 'PERIOD'">
      <div class="calendar-header">
        <button class="btn pointer btn-previous" (click)="minusYear(-12)">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.20437 4.99956L5.91687 8.71206L4.85637 9.77256L0.083374 4.99956L4.85637 0.226562L5.91687 1.28706L2.20437 4.99956Z" fill="#525866"/>
          </svg>
        </button>
        <div class="btn label">Periodo</div>
        <button class="btn pointer btn-next" (click)="plusYear(12)">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.79587 4.99956L0.083374 1.28706L1.14387 0.226562L5.91687 4.99956L1.14387 9.77256L0.083374 8.71206L3.79587 4.99956Z" fill="#525866"/>
          </svg>
        </button>
      </div>
      <div aria-describedby="calendar">
        <div style="display: grid; grid-template-columns: repeat(4, auto);">
          <button  *ngFor="let year of years" class="year pointer"
            [ngClass]="{
              'today': today.getFullYear() === year,
              'selected': selected.getFullYear() === year
            }"
            (click)="selectYear(year)">
            {{ year }}
          </button>
        </div>
      </div>
    </div>

    <div class="month-view view" *ngIf="view === 'YEAR'">
      <div class="calendar-header">
        <button class="btn pointer btn-previous" (click)="minusYear()">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.20437 4.99956L5.91687 8.71206L4.85637 9.77256L0.083374 4.99956L4.85637 0.226562L5.91687 1.28706L2.20437 4.99956Z" fill="#525866"/>
          </svg>
        </button>
        <button class="btn label pointer" (click)="changeView('PERIOD')" >
          {{ date.getFullYear() }}
        </button>
        <button class="btn pointer btn-next" (click)="plusYear()">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.79587 4.99956L0.083374 1.28706L1.14387 0.226562L5.91687 4.99956L1.14387 9.77256L0.083374 8.71206L3.79587 4.99956Z" fill="#525866"/>
          </svg>
        </button>
      </div>
      <div aria-describedby="calendar">
        <div style="display: grid; grid-template-columns: repeat(4, auto);">
          <button *ngFor="let month of months; let i = index" class="month pointer"
            [ngClass]="{
              'today': today.getFullYear() === date.getFullYear() && today.getMonth() === i,
              'selected': date.getFullYear() === selected.getFullYear() && date.getMonth() === i
            }"
            (click)="selectMonth(month)">
            {{ month.acronym }}
          </button>
        </div>
      </div>
    </div>

    <div class="date-view view" *ngIf="view === 'MONTH'">
      <div class="calendar-header">
        <button class="pointer btn btn-previous" (click)="minusMonth()">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.20437 4.99956L5.91687 8.71206L4.85637 9.77256L0.083374 4.99956L4.85637 0.226562L5.91687 1.28706L2.20437 4.99956Z" fill="#525866"/>
          </svg>
        </button>
        <button class="label btn pointer" (click)="changeView('YEAR')" >
          {{ months[date.getMonth()].label }}, {{ date.getFullYear() }}
        </button>
        <button class="pointer btn btn-next" (click)="plusMonth()">
          <svg width="6" height="10" viewBox="0 0 6 10" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.79587 4.99956L0.083374 1.28706L1.14387 0.226562L5.91687 4.99956L1.14387 9.77256L0.083374 8.71206L3.79587 4.99956Z" fill="#525866"/>
          </svg>
        </button>
      </div>
      <table class="ucam-calendar" aria-describedby="calendar">
        <thead>
          <th *ngFor="let weekday of weekdays">
            {{ weekday.letter }}
          </th>
        </thead>
        <tbody>
          <tr *ngFor="let week of calendar">
            <td *ngFor="let day of week" class="day pointer"
              [ngClass]="{
                'other-month': day.getMonth() != date.getMonth(),
                'current-month': day.getMonth() == date.getMonth(),
                'next-month': day.getMonth() > date.getMonth(),
                'previous-month': day.getMonth() < date.getMonth(),
                'other-year': day.getFullYear() != today.getFullYear(),
                'current-year': day.getFullYear() == today.getFullYear(),
                'next-year': day.getFullYear() > today.getFullYear(),
                'previous-year': day.getFullYear() < today.getFullYear(),
                'today': dateEquals(day, today),
                'selected': dateEquals(day, selected)
              }"
              (click)="selectDay(day)">
              {{ day.getDate() }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="ucam-calendar-backdrop" (click)="open = !open"></div>
</details>

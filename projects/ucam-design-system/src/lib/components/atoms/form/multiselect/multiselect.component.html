<div class="ucam-multiselect-wrapper" [class.enabled]="!__disabled" [class.disabled]="__disabled">
  <button type="button" class="ucam-select-input" [class.is-open]="__open" (click)="__toggleOpen($event)" cdkOverlayOrigin #trigger="cdkOverlayOrigin">
    <span>{{ __label() }}</span>
    @if (icon()) {
      <i class="select-ucam-font-icon {{icon_type()}} {{icon()}} {{icon_class()}}"></i>
    }
    @if (!icon()) {
      <svg class="select-ucam-icon" aria-label="arrow down" data-testid="arrowDown" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M7.231 9.24a.77.77 0 0 1 1.117 0L12 13.025l3.652-3.785a.77.77 0 0 1 1.117 0 .84.84 0 0 1 0 1.157l-4.21 4.363a.77.77 0 0 1-1.117 0l-4.21-4.363a.84.84 0 0 1 0-1.157Z"></path>
      </svg>
    }
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="__open"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="__setClose()"
    [cdkConnectedOverlayWidth]="trigger.elementRef.nativeElement.offsetWidth"
  >
    <div class="ucam-select-options-wrapper">
      @if (type() === 'multiselect') {
        <form [formGroup]="__form" class="ucam-select-form">
          <div width="32">
            <span class="ucam-select-options-all" [ngClass]="{'checked': __isAllActive(), 'some': __isSomeActive()}" (click)="__toggleAll()"></span>
          </div>
          <input class="ucam-select-options-input" placeholder="Pesquisar" type="search" formControlName="search" (search)="__filterInputValue()" (blur)="__filterInputValue()" (input)="__filterInputValue()">
        </form>
      }
      <div class="ucam-select-option-list">
        @for (option of __filteredValues(); track option) {
          <div class="ucam-select-option" [title]="option.label" [class.valid]="option.valid" [class.active]="__isActive(option)" (click)="option.valid && __selectOption(option)">
            <input [type]=" type() === 'select' ? 'radio' : 'checkbox'" [name]="id()" [value]="option.value" class="ucam-select-option-check" [checked]="__isActive(option)">
            <span class="ucam-select-option-label"> {{ option.label }} </span> <br>
            @if (option.description) {
              <span class="ucam-select-option-description"> {{ option.description }} </span>
            }
          </div>
        }
      </div>
    </div>
  </ng-template>
</div>

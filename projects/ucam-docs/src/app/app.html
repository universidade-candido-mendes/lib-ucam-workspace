<ucam-page>
  <header>
    <div style="padding: 10px 20px; font-weight: bold;">Docs Workspace</div>
  </header>
  
  <div class="ucam-content--larga" style="padding: 2rem;">
    <h1>UCAM Design System</h1>
    <p class="ucam-descricao__valor">Catálogo de Componentes Interativos</p>

    <section class="ucam-section" style="margin-top: 2rem;">
      <h2 class="ucam-section__title">Estatísticas (ucam-stat)</h2>
      <div class="ucam-cluster ucam-cluster--md">
        <ucam-stat label="Alunos Ativos" value="1.240" tone="default"></ucam-stat>
        <ucam-stat label="Matrículas" value="89%" tone="success"></ucam-stat>
        <ucam-stat label="Inadimplência" value="12%" tone="danger" meta="Acima da média"></ucam-stat>
      </div>
    </section>

    <section class="ucam-section" style="margin-top: 2rem;">
      <h2 class="ucam-section__title">Listas de Descrição (ucam-description-list)</h2>
      <ucam-card>
        <div style="padding: 1rem;">
          <ucam-description-list [items]="docItems"></ucam-description-list>
        </div>
      </ucam-card>
    </section>

    <section class="ucam-section" style="margin-top: 2rem;">
      <h2 class="ucam-section__title">Tabelas Genéricas (ucam-table)</h2>
      <ucam-card>
        <ucam-table [compact]="true">
          <thead>
            <tr>
              <th class="ucam-table__coluna">Componente</th>
              <th class="ucam-table__coluna">Tipo</th>
              <th class="ucam-table__coluna">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>ucam-stat</td>
              <td>Atom</td>
              <td><span class="ucam-stat--success">Finalizado</span></td>
            </tr>
            <tr>
              <td>ucam-table</td>
              <td>Atom</td>
              <td><span class="ucam-stat--success">Finalizado</span></td>
            </tr>
            <tr>
              <td>ucam-card</td>
              <td>Atom</td>
              <td><span class="ucam-stat--success">Finalizado</span></td>
            </tr>
          </tbody>
        </ucam-table>
      </ucam-card>
    </section>
  </div>
</ucam-page>

name: Deploy UCAM Docs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build UCAM Design System Library
        run: npm run build

      - name: Build UCAM Docs App
        run: npx ng build ucam-docs --base-href /lib-ucam-workspace/ --configuration production

      - name: Deploy to GitHub Pages (live-doc branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/ucam-docs/browser
          publish_branch: live-doc
